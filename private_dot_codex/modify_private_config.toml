#!/usr/bin/env python3
# Chezmoi modify script: pin the default model keys in ~/.codex/config.toml.
# Everything else (plugins, MCP servers, desktop, trust, hooks state) is written
# by the Codex app per machine and passed through untouched.
#
# Profiles live next to it as ~/.codex/<name>.config.toml (codex -p <name>),
# managed by chezmoi as plain files. Aliases: cx, cxa, cxf, cxl in ~/.zshrc.
import re
import sys

MANAGED = {
    "model": '"gpt-6-sol"',
    "model_reasoning_effort": '"medium"',
    "plan_mode_reasoning_effort": '"high"',
    "check_for_update_on_startup": "true",
}

lines = sys.stdin.read().splitlines()

# Top-level keys must sit before the first [table] header.
first_table = next((i for i, l in enumerate(lines) if l.lstrip().startswith("[")), len(lines))
head, tail = lines[:first_table], lines[first_table:]

seen = set()
for i, line in enumerate(head):
    m = re.match(r"\s*([A-Za-z0-9_]+)\s*=", line)
    if m and m.group(1) in MANAGED:
        head[i] = f"{m.group(1)} = {MANAGED[m.group(1)]}"
        seen.add(m.group(1))

missing = [f"{k} = {v}" for k, v in MANAGED.items() if k not in seen]
while head and not head[-1].strip():
    head.pop()
head += missing
if tail:
    head.append("")

sys.stdout.write("\n".join(head + tail) + "\n")
